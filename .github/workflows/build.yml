# Builds the mod menu APK: the menu, the ported hooks and the bundled Dobby
# static archive end up in one lib/arm64-v8a/libboku.so inside the APK.
#
# A push to main builds. The workflow can also be started by hand to try a
# different runner image without editing this file.
name: Build bokuLGL

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image label"
        type: string
        default: "ubuntu-24.04"

jobs:
  format:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format

      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'app/src/main/jni/boku/*.cpp' \
            'app/src/main/jni/boku/*.h' 'app/src/main/jni/boku/hooks/*.cpp')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ sources tracked"
            exit 0
          fi
          echo "Checking ${#files[@]} files"
          if clang-format --dry-run --Werror "${files[@]}"; then
            echo "Formatting OK"
            exit 0
          fi
          clang-format -i "${files[@]}"
          git diff > "$RUNNER_TEMP/format.patch"
          {
            echo "### clang-format differences"
            echo 'Download the `format-patch` artifact and run `git apply format.patch`.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::clang-format found differences, see the format-patch artifact"
          exit 1

      - name: Upload format patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: ignore

  build:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # The runner image ships several NDKs. Take the newest one and hand its
      # path and version to Gradle, so AGP never downloads another copy and the
      # pair always matches.
      - name: Detect NDK
        id: ndk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR="$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1)"
          NDK_DIR="${NDK_DIR%/}"
          [ -n "$NDK_DIR" ] || { echo "::error::no NDK installed in $SDK/ndk"; exit 1; }
          echo "path=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$NDK_DIR")" >> "$GITHUB_OUTPUT"
          echo "NDK $NDK_DIR"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        env:
          # Point AGP at the detected NDK instead of downloading its default.
          NDK_PATH: ${{ steps.ndk.outputs.path }}
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -Porg.gradle.jvmargs=-Xmx3g assembleDebug \
            -PBOKU_BUILD_SEED="$GITHUB_RUN_ID" \
            -PBOKU_BUILD_COMMIT="$GITHUB_SHA"

      - name: Verify native library inside the APK
        run: |
          set -euo pipefail
          RE="${{ steps.ndk.outputs.path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::no debug APK was produced"; exit 1; }
          echo "APK: $APK"

          mkdir -p apkcheck
          unzip -o -q "$APK" 'lib/arm64-v8a/libboku.so' -d apkcheck
          SO="apkcheck/lib/arm64-v8a/libboku.so"
          [ -f "$SO" ] || { echo "::error::libboku.so is missing from the APK"; exit 1; }

          "$RE" -h "$SO" | grep -E "Class:|Machine:"
          "$RE" -h "$SO" | grep -Eq "Class:[[:space:]]+ELF64[[:space:]]*$" \
            || { echo "::error::wrong ELF class"; exit 1; }
          "$RE" -h "$SO" | grep -Eq "Machine:[[:space:]]+AArch64[[:space:]]*$" \
            || { echo "::error::wrong machine"; exit 1; }
          "$RE" -d "$SO" | grep -E "NEEDED|SONAME" || true

          # Dobby is linked statically: no companion .so, and its symbols stay
          # local so two mods can load without clashing in .dynsym.
          if "$RE" --dyn-syms "$SO" | grep -Eq " (Dobby|dobby_)[A-Za-z0-9_]"; then
            echo "::error::Dobby symbols are exported"
            "$RE" --dyn-syms "$SO" | grep -E " (Dobby|dobby_)[A-Za-z0-9_]"
            exit 1
          fi

          # ART resolves JNI_OnLoad from the loaded library itself.
          "$RE" --dyn-syms "$SO" | grep -Eq "FUNC +GLOBAL +DEFAULT +[0-9]+ JNI_OnLoad$" \
            || { echo "::error::libboku.so does not export JNI_OnLoad"; exit 1; }

      - name: Collect artifact
        run: |
          set -euo pipefail
          OUT="dist"
          mkdir -p "$OUT"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          cp "$APK" "$OUT/bokuLGL-debug.apk"
          cp "app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/arm64-v8a/libboku.so" \
            "$OUT/libboku.so" 2>/dev/null || true
          {
            echo "Dobby (prebuilt static archive bundled with the template)"
            echo "  Apache License 2.0, https://github.com/jmpews/Dobby"
            echo
            cat "app/src/main/jni/Dobby/LICENSE"
          } > "$OUT/THIRD_PARTY_LICENSES"
          ls -l "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bokuLGL-apk
          path: dist/
          if-no-files-found: error
