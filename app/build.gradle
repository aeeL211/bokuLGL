apply plugin: 'com.android.application'

// ShadowHook is fetched by CI and passed in; nothing is vendored.
def shadowhookRoot = project.findProperty("SHADOWHOOK_ROOT") ?: System.getenv("SHADOWHOOK_ROOT") ?: ""

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.android.support"
        // The native library and the IL2CPP API require Android 7.0 or newer.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
        // CMake arguments belong to the per-variant options; the android-level
        // block below only carries the script path.
        externalNativeBuild {
            cmake {
                arguments "-DSHADOWHOOK_ROOT=" + shadowhookRoot,
                        "-DBOKU_BUILD_SEED=" + (project.findProperty("BOKU_BUILD_SEED") ?: "1"),
                        "-DBOKU_BUILD_COMMIT=" + (project.findProperty("BOKU_BUILD_COMMIT") ?: "dev"),
                        "-DBOKU_LIB_NAME=libboku.so"
            }
        }
    }
    android.buildFeatures.buildConfig = true
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }
    namespace 'com.android.support'
}

// CI detects the runner's NDK and passes it in; AGP then never downloads one
// and the path/version pair always matches.
def ndkPath = System.getenv("NDK_PATH")
def ndkVersion = System.getenv("NDK_VERSION")
if (ndkPath && ndkVersion) {
    android.ndkPath = ndkPath
    android.ndkVersion = ndkVersion
}

//dependencies must be placed below 'android' brackets to get it work on AIDE
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
